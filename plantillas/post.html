<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Pop;font-weight:400;src:url(https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.0.8/files/poppins-latin-400-normal.woff2)}@font-face{font-family:Pop;font-weight:500;src:url(https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.0.8/files/poppins-latin-500-normal.woff2)}@font-face{font-family:Pop;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.0.8/files/poppins-latin-700-normal.woff2)}@font-face{font-family:Pop;font-weight:800;src:url(https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.0.8/files/poppins-latin-800-normal.woff2)}html,body{margin:0;padding:0;background:#222}
.c{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Pop,sans-serif;color:#fff;background:linear-gradient(135deg,#00286e 0%,#00317f 45%,#0047ab 100%);box-sizing:border-box;padding:80px 84px}
.wm{position:absolute;right:-180px;bottom:-200px;width:720px;height:720px;border-radius:50%;border:90px solid rgba(255,255,255,.05)}
.wm2{position:absolute;right:-20px;bottom:-40px;width:400px;height:400px;border-radius:50%;border:60px solid rgba(255,255,255,.04)}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font-weight:700;font-size:34px;letter-spacing:3px}
.logo s{text-decoration:none;font-size:12px;letter-spacing:5px;opacity:.85;margin-top:6px}
.ic{margin-top:70px;width:110px;height:110px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.tag{display:inline-block;margin-top:34px;background:#F0A93E;color:#00286e;font-weight:700;font-size:20px;letter-spacing:1.5px;padding:6px 20px;border-radius:999px}
h1{margin:22px 0 0;font-weight:800;font-size:66px;line-height:1.06;letter-spacing:-1px}
.sub{margin-top:18px;font-size:27px;font-weight:500;opacity:.9}
ol{list-style:none;padding:0;margin:44px 0 0;counter-reset:n}
ol li{counter-increment:n;display:flex;gap:22px;align-items:flex-start;font-size:29px;font-weight:500;line-height:1.3;margin-bottom:24px}
ol li::before{content:counter(n);flex:none;width:50px;height:50px;border-radius:50%;background:#F0A93E;color:#00286e;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center}
ol li span b{font-weight:700}
.foot{position:absolute;left:84px;right:84px;bottom:64px;display:flex;justify-content:space-between;align-items:center}
.wa{background:#fff;color:#004aad;font-weight:800;font-size:28px;padding:12px 30px;border-radius:999px}
.small{font-size:19px;opacity:.8;text-align:right}</style></head><body><div class="c" id="post"><div class="wm"></div><div class="wm2"></div><div class="logo"><b>GIAQUINTA</b><s>ASESORES DE SEGUROS</s></div><div class="ic">{{ICON_SVG}}</div><span class="tag">{{TAG}}</span><h1>{{TITLE}}</h1><div class="sub">{{SUBTITLE}}</div><ol>{{ITEMS}}</ol><div class="foot"><span class="wa">WhatsApp 299 620-0998</span><span class="small">+15 años cuidando lo tuyo<br>San Martín 4143, Neuquén</span></div></div></body></html>
